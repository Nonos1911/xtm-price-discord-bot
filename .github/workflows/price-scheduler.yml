name: Prix XTM planifiés

"on":
  workflow_dispatch:
    inputs:
      test_alerts:
        description: "Test des alertes dans mog-post, dont une progression visuelle de 3 minutes"
        required: false
        type: choice
        options:
          - none
          - positive_pair_once
          - both_once
          - progression_3min
          - progression_4min
          - milestone_22
          - verify_test
        default: none
      snapshot_only:
        description: "Publier un snapshot ponctuel dans mog-post"
        required: false
        type: choice
        options:
          - false
          - true
        default: false
      alerts_override:
        description: "Surcharge ponctuelle; pour un réglage permanent, utiliser les variables Actions du dépôt"
        required: false
        type: choice
        options:
          - inherit
          - pause
          - resume
        default: inherit
      upward_threshold_override:
        description: "Seuil haussier ponctuel; pour un réglage permanent, utiliser ALERT_THRESHOLD_PERCENT dans les variables du dépôt"
        required: false
        type: choice
        options:
          - inherit
          - "10"
          - "20"
          - "30"
          - "40"
        default: inherit

permissions:
  contents: read

jobs:
  update-discord:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Mettre à jour Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1370700962695610430"
          ALERT_CHANNEL_ID: "1163364187796426776"
          ALERT_THRESHOLD_PERCENT: ${{ inputs.upward_threshold_override != 'inherit' && inputs.upward_threshold_override || vars.ALERT_THRESHOLD_PERCENT || '10' }}
          ALERTS_PAUSED: ${{ inputs.alerts_override == 'pause' && 'true' || inputs.alerts_override == 'resume' && 'false' || vars.ALERTS_PAUSED || 'false' }}
          TEST_ALERTS: ${{ inputs.test_alerts || 'none' }}
          SNAPSHOT_ONLY: ${{ inputs.snapshot_only || 'false' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_PLAN: demo
        run: python src/update_once.py
