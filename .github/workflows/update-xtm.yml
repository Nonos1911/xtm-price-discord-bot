name: Mettre à jour les cours XTM

on:
  schedule:
    # Décalé de 2 minutes pour éviter les créneaux de forte charge à l'heure.
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alerts:
        description: "Test ponctuel des deux alertes dans mog-post"
        required: false
        type: choice
        options:
          - none
          - both_once
        default: none

permissions:
  contents: read

jobs:
  update-discord:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Mettre à jour Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1370700962695610430"
          ALERT_CHANNEL_ID: "1163364187796426776"
          ALERT_THRESHOLD_PERCENT: "10"
          ALERT_REPEAT_COUNT: "5"
          ALERT_INTERVAL_SECONDS: "60"
          TEST_ALERTS: ${{ inputs.test_alerts || 'none' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_PLAN: demo
        run: python src/update_once.py
